metadata:
  package_id: mc-eu-sample
  version: 1.0.0
  network: MASTERCARD
  region: EUROPE
  effective_from: 2026-01-01T00:00:00Z
  environment: TEST
  source_references:
    - https://www.mastercard.com/europe/en/business/support/merchant-interchange-rates.html

programs:
  - id: MC-EU-CONSUMER-CREDIT-CP-SAMPLE
    name: Sample consumer credit card-present program
    network: MASTERCARD
    region: EUROPE
    effective_from: 2026-01-01T00:00:00Z
    fallback: false

rules:
  - id: rule-sample-001
    program_id: MC-EU-CONSUMER-CREDIT-CP-SAMPLE
    priority: 1000
    effective_from: 2026-01-01T00:00:00Z
    source_reference: https://www.mastercard.com/europe/en/business/support/merchant-interchange-rates.html
    conditions:
      all:
        - field: network
          operator: equals
          value: MASTERCARD
        - field: region_relation
          operator: equals
          value: INTRA_EEA
        - field: funding_type
          operator: equals
          value: CREDIT
        - field: cardholder_type
          operator: equals
          value: CONSUMER
        - field: channel
          operator: equals
          value: CARD_PRESENT
    rate:
      percentage_bps: 30
      fixed_minor_units: 0
      rounding_policy: HALF_UP_MINOR_UNIT
