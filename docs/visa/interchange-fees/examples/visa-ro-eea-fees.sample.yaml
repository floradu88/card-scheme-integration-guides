rules:
  - id: rule-ro-consumer-debit-domestic-001
    program_id: VISA-RO-CONSUMER-DEBIT-DOMESTIC-SAMPLE
    priority: 100
    effective_from: 2026-04-01T00:00:00Z
    source_reference: illustrative-domestic-schedule
    conditions:
      all:
        - field: network
          operator: equals
          value: VISA
        - field: merchant_country
          operator: equals
          value: RO
        - field: region_relation
          operator: equals
          value: DOMESTIC
        - field: funding_type
          operator: equals
          value: DEBIT
        - field: cardholder_type
          operator: equals
          value: CONSUMER
    rate:
      percentage_bps: 20
      fixed_minor_units: 0
      rounding_policy: HALF_UP_MINOR_UNIT

  - id: rule-ro-consumer-credit-intra-eea-001
    program_id: VISA-RO-CONSUMER-CREDIT-INTRA-EEA-SAMPLE
    priority: 100
    effective_from: 2026-04-01T00:00:00Z
    source_reference: illustrative-intra-eea-schedule
    conditions:
      all:
        - field: network
          operator: equals
          value: VISA
        - field: merchant_country
          operator: equals
          value: RO
        - field: region_relation
          operator: equals
          value: INTRA_EEA
        - field: funding_type
          operator: equals
          value: CREDIT
        - field: cardholder_type
          operator: equals
          value: CONSUMER
    rate:
      percentage_bps: 30
      fixed_minor_units: 0
      rounding_policy: HALF_UP_MINOR_UNIT

  - id: rule-ro-commercial-credit-001
    program_id: VISA-RO-COMMERCIAL-CREDIT-SAMPLE
    priority: 200
    effective_from: 2026-04-01T00:00:00Z
    source_reference: illustrative-commercial-schedule
    conditions:
      all:
        - field: network
          operator: equals
          value: VISA
        - field: merchant_country
          operator: equals
          value: RO
        - field: cardholder_type
          operator: equals
          value: COMMERCIAL
        - field: funding_type
          operator: equals
          value: CREDIT
    rate:
      percentage_bps: 165
      fixed_minor_units: 0
      rounding_policy: HALF_UP_MINOR_UNIT
